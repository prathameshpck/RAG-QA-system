
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - llm

  llm: 
    image: vllm/vllm-openai:latest 
    runtime: nvidia
    container_name: llm 
    ports: 
      - "8000:8000"
    volumes: 
      - ~/.cache/huggingface:/root/.cache/huggingface 
    environment:
      - HUGGING_FACE_HUB_TOKEN=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 
    ipc: host
    command: [
      "--model",
      "neuralmagic/Llama-2-7b-chat-quantized.w8a8"
    ]

  prometheus: 
    image: prom/prometheus 
    ports: 
      - 9090:9090 
    container_name: prometheus
    volumes: 
      - /home/ubuntu/app/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml 
    
  grafana: 
    image: grafana/grafana 
    ports: 
      - 3000:3000 
    container_name: grafana 
    

    
